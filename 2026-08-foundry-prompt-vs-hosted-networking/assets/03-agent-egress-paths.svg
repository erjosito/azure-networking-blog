<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="1400" height="780" role="img" aria-label="03 — Agent egress paths (HS1 / advanced / HS2)">
  <title>03 — Agent egress paths (HS1 / advanced / HS2)</title>
  <rect x="0" y="0" width="1400" height="780" fill="#FFFFFF"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D13438"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107C10"/>
    </marker>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #000; }
    .title { font-size: 20px; font-weight: 700; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #333; }
    .lab { font-size: 13px; }
    .lab-b { font-size: 13px; font-weight: 700; }
    .small { font-size: 11px; fill: #333; }
    .edge { font-size: 11px; fill: #1e1e1e; }
    .mono { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }
  </style>
  <text x="30" y="34" class="t title" text-anchor="start"><tspan x="30" dy="0">03 — Agent egress paths (HS1 / advanced / HS2)</tspan></text>
  <text x="30" y="60" class="t small" text-anchor="start"><tspan x="30" dy="0">Three egress paths converging on echo.tools.lab; observable src_ip differs between Paths 1+2 and Path 3.</tspan></text>
  <rect x="30" y="110" width="900" height="140" rx="8" ry="8" fill="transparent" stroke="#0078D4" stroke-width="2"/>
  <text x="42" y="132" class="t subtitle" text-anchor="start">Path 1 — Prompt agent OpenAPI tool call (HS1)</text>
  <rect x="30" y="290" width="900" height="140" rx="8" ry="8" fill="transparent" stroke="#5C2D91" stroke-width="2"/>
  <text x="42" y="312" class="t subtitle" text-anchor="start">Path 2 — Hosted agent OpenAPI toolbox tool call (advanced)</text>
  <rect x="30" y="470" width="900" height="140" rx="8" ry="8" fill="transparent" stroke="#F7630C" stroke-width="2"/>
  <text x="42" y="492" class="t subtitle" text-anchor="start">Path 3 — Hosted agent direct Python call (HS2)</text>
  <rect x="60" y="160" width="200" height="70" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="160" y="191" class="t lab" text-anchor="middle"><tspan x="160" dy="0" font-weight="700">Prompt agent</tspan><tspan x="160" dy="16">Foundry endpoint</tspan></text>
  <rect x="320" y="160" width="180" height="70" rx="8" ry="8" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <text x="410" y="199" class="t lab" text-anchor="middle"><tspan x="410" dy="0" font-weight="700">Tools Service</tspan></text>
  <rect x="560" y="160" width="220" height="70" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="670" y="183" class="t lab" text-anchor="middle"><tspan x="670" dy="0" font-weight="700">Data Proxy</tspan><tspan x="670" dy="16">src_ip = 192.168.0.x</tspan><tspan x="670" dy="16">data proxy IP</tspan></text>
  <path d="M 260 195 L 320 195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 195 L 560 195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="340" width="200" height="70" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="160" y="371" class="t lab" text-anchor="middle"><tspan x="160" dy="0" font-weight="700">Hosted agent</tspan><tspan x="160" dy="16">Foundry endpoint</tspan></text>
  <rect x="320" y="340" width="180" height="70" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="410" y="371" class="t lab" text-anchor="middle"><tspan x="410" dy="0" font-weight="700">Micro VM</tspan><tspan x="410" dy="16">calls Toolbox SDK</tspan></text>
  <rect x="560" y="340" width="220" height="70" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="670" y="363" class="t lab" text-anchor="middle"><tspan x="670" dy="0" font-weight="700">Data Proxy</tspan><tspan x="670" dy="16">src_ip = 192.168.0.x</tspan><tspan x="670" dy="16">same range as Path 1</tspan></text>
  <path d="M 260 375 L 320 375" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500 375 L 560 375" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="520" width="200" height="70" rx="8" ry="8" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/>
  <text x="160" y="551" class="t lab" text-anchor="middle"><tspan x="160" dy="0" font-weight="700">Hosted agent</tspan><tspan x="160" dy="16">Foundry endpoint</tspan></text>
  <rect x="320" y="520" width="220" height="70" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="430" y="543" class="t lab" text-anchor="middle"><tspan x="430" dy="0" font-weight="700">Micro VM</tspan><tspan x="430" dy="16">requests.get directly</tspan><tspan x="430" dy="16">src_ip = 192.168.0.y (NIC)</tspan></text>
  <path d="M 260 555 L 320 555" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1050" y="280" width="300" height="120" rx="8" ry="8" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <text x="1200" y="328" class="t lab" text-anchor="middle"><tspan x="1200" dy="0" font-weight="700">vm-tools-echo</tspan><tspan x="1200" dy="16">10.1.100.4</tspan><tspan x="1200" dy="16">echo.tools.lab</tspan></text>
  <path d="M 780 195 L 1050 310" fill="none" stroke="#0078D4" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="867.75" y="234.5" width="94.5" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="915" y="246.5" class="t edge" text-anchor="middle"><tspan x="915" dy="0">HTTP/S 80/443</tspan></text>
  <path d="M 780 375 L 1050 340" fill="none" stroke="#5C2D91" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="867.75" y="339.5" width="94.5" height="20" fill="#FFFFFF" opacity="0.92"/>
  <text x="915" y="351.5" class="t edge" text-anchor="middle"><tspan x="915" dy="0">HTTP/S 80/443</tspan></text>
  <path d="M 540 555 L 1050 370" fill="none" stroke="#F7630C" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="721.75" y="444.5" width="146.5" height="34" fill="#FFFFFF" opacity="0.92"/>
  <text x="795" y="456.5" class="t edge" text-anchor="middle"><tspan x="795" dy="0">HTTP/S — Micro VM NIC</tspan><tspan x="795" dy="14">different src_ip</tspan></text>
  <rect x="30" y="640" width="1340" height="110" rx="8" ry="8" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <text x="50" y="674" class="t lab-b" text-anchor="start"><tspan x="50" dy="0" font-weight="700">Key finding tested:</tspan><tspan x="50" dy="20">• Paths 1 and 2 share src_ip range (Data Proxy IPs on AgentSubnet 192.168.0.x).</tspan><tspan x="50" dy="20">• Path 3 src_ip differs (Micro VM NIC egress). Open question OQ1 tracks whether both NIC and proxy IPs coexist for the same agent.</tspan></text>
</svg>
